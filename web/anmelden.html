<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Anmelden · Runner-Monitor</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/stil.css">
<script src="/static/i18n.js" defer></script>
<script src="/static/gemeinsam.js" defer></script>
<script src="/static/anmelden.js" defer></script>
</head>
<body class="formular">
<main class="form-mitte zentriert">
  <div class="marke">
    <span class="vm-icon" id="marke-icon"></span>
    <div class="marke-titel">Runner-Monitor</div>
    <div class="marke-sub" id="marke-host"></div>
  </div>

  <form class="form-karte" id="formular" method="post" action="/api/anmelden" novalidate>
    <h1 data-t>Anmelden</h1>
    <div class="meldung-box fehler" id="meldung" role="alert" hidden></div>
    <div class="feld">
      <label for="nutzer" data-t>Benutzername</label>
      <input id="nutzer" name="nutzer" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="feld">
      <label for="passwort" data-t>Passwort</label>
      <input id="passwort" name="passwort" type="password" autocomplete="current-password" required>
    </div>
    <label class="merken"><input type="checkbox" id="merken" checked><span data-t>Angemeldet bleiben (30 Tage)</span></label>
    <button type="submit" class="knopf-voll" id="absenden" data-t>Anmelden</button>
  </form>

  <p class="hilfe"><span data-t>Passwort vergessen? Auf der VM neu setzen:</span> <code>sudo /opt/runner-monitor/aktuell/einrichten.sh passwort</code></p>
</main>
<footer class="form-fuss"><span id="fuss-version">Runner-Monitor</span><span>·</span><a href="https://bamberger-it-services.de" rel="noopener" target="_blank">Bamberger IT Services</a><span>·</span><button type="button" class="link-knopf sprache-knopf" id="sprache"></button></footer>
</body>
</html>
