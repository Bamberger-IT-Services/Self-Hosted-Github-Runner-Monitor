<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Anmelden · Runner-Monitor</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/stil.css">
<script src="/static/gemeinsam.js" defer></script>
<script src="/static/anmelden.js" defer></script>
</head>
<body class="formular">
<main class="form-mitte zentriert">
  <div class="marke">
    <span class="vm-icon" id="marke-icon"></span>
    <div class="marke-titel">Runner-Monitor</div>
    <div class="marke-sub" id="marke-host"></div>
  </div>

  <form class="form-karte" id="formular" novalidate>
    <h1>Anmelden</h1>
    <div class="meldung-box fehler" id="meldung" role="alert" hidden></div>
    <div class="feld">
      <label for="nutzer">Benutzername</label>
      <input id="nutzer" name="nutzer" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="feld">
      <label for="passwort">Passwort</label>
      <input id="passwort" name="passwort" type="password" autocomplete="current-password" required>
    </div>
    <label class="merken"><input type="checkbox" id="merken"> Angemeldet bleiben (30 Tage)</label>
    <button type="submit" class="knopf-voll" id="absenden">Anmelden</button>
  </form>

  <p class="hilfe">Passwort vergessen? Auf der VM ein neues setzen:<br><code>sudo ./einrichten.sh passwort</code></p>
</main>
<footer class="form-fuss">
  <a href="https://github.com/Bamberger-IT-Services/Self-Hosted-Github-Runner-Monitor" rel="noopener" target="_blank">Runner-Monitor</a>
  <span>Bamberger IT Services</span>
</footer>
</body>
</html>
