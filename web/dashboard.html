<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<meta name="color-scheme" content="light dark">
<title>Runner-Monitor</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/stil.css">
<script src="/static/i18n.js" defer></script>
<script src="/static/gemeinsam.js" defer></script>
<script src="/static/verlauf.js" defer></script>
<script src="/static/mail.js" defer></script>
<script src="/static/dashboard.js" defer></script>
</head>
<body class="dashboard">
<div class="rm" id="rm">

  <header class="kopf">
    <div class="vm">
      <span class="vm-icon" id="vm-icon"></span>
      <div class="vm-name" id="vm-name" title="Name der VM (Hostname)" data-t-title>–</div>
    </div>
    <div class="kopf-trenner"></div>
    <div class="runner"><div class="runner-name" id="runner-name">–</div><div class="labels" id="labels"></div></div>
    <div class="meldungen" id="meldungen" role="status" aria-live="polite"></div>
    <div class="kopf-rechts">
      <span class="live neutral" id="live"></span>
      <span class="uhr"><span class="uhr-datum" id="uhr-datum"></span><span class="uhr-zeit" id="uhr-zeit"></span></span>
      <button type="button" class="knopf modus-knopf" id="k-modus" title="Darstellung: Automatisch, Hell oder Dunkel" data-t-title></button>
      <button type="button" class="knopf" id="k-info" aria-haspopup="dialog"></button>
    </div>
  </header>

  <main class="raster" id="raster">
    <div class="spalte a">
      <section class="karte status" id="status" aria-label="Runner-Status" data-t-aria></section>
      <section class="karte wf" id="workflows" aria-label="Workflows je Repository" data-t-aria></section>
    </div>

    <section class="karte ausl" aria-label="Auslastung" data-t-aria>
      <div class="karte-kopf"><span class="karte-titel" data-t>Auslastung</span><span class="karte-meta" id="sys-meta"></span>
        <div class="segment zeitraum" id="zeitraum" role="group" aria-label="Zeitraum des Verlaufs" data-t-aria title="Zeitraum für CPU-, RAM- und Netzwerk-Verlauf" data-t-title><button type="button" class="seg-knopf" data-aktion="zeitraum" data-zeitraum="30" aria-pressed="false" data-t>30 s</button><button type="button" class="seg-knopf" data-aktion="zeitraum" data-zeitraum="120" aria-pressed="false" data-t>2 Min.</button><button type="button" class="seg-knopf" data-aktion="zeitraum" data-zeitraum="300" aria-pressed="false" data-t>5 Min.</button><button type="button" class="seg-knopf" data-aktion="zeitraum" data-zeitraum="600" aria-pressed="true" data-t>10 Min.</button></div>
      </div>
      <div class="ausl-raster">
        <div class="ausl-spalte">
          <div class="gross-zeile"><span class="mess-label" data-t>CPU gesamt</span><span class="gross-wert"><span id="cpu">–</span><span class="einheit">%</span></span></div>
          <div class="spark spark-cpu">
            <div class="spark-flaeche-box"><svg id="cpu-svg" viewBox="0 0 300 46" preserveAspectRatio="none" role="img" aria-label="CPU-Verlauf der letzten 10 Minuten" data-t-aria><line class="spark-raster" x1="0" y1="23" x2="300" y2="23"/><path class="spark-flaeche" id="cpu-flaeche"/><path class="spark-linie" id="cpu-linie"/></svg></div>
            <div class="spark-achse"><span class="achse-von">vor 10 Min.</span><span>50 %</span><span data-t>jetzt</span></div>
          </div>
          <div class="kerne" id="kerne"></div>
        </div>
        <div class="ausl-spalte">
          <div class="gross-zeile"><span class="mess-label" data-t>Arbeitsspeicher</span><span class="gross-wert"><span id="ram">–</span><span class="einheit einheit-ram" id="ram-gesamt"></span></span></div>
          <div class="spark spark-ram">
            <div class="spark-flaeche-box"><svg id="ram-svg" viewBox="0 0 300 46" preserveAspectRatio="none" role="img" aria-label="RAM-Verlauf der letzten 10 Minuten" data-t-aria><line class="spark-raster" x1="0" y1="23" x2="300" y2="23"/><path class="spark-flaeche" id="ram-flaeche"/><path class="spark-linie" id="ram-linie"/></svg></div>
          </div>
          <div class="meter"><span class="m-l">RAM</span><span class="balken"><span class="fuell" id="ram-fuell"></span></span><span class="m-w" id="ram-pct"></span></div>
          <div class="meter"><span class="m-l">Swap</span><span class="balken"><span class="fuell gedimmt" id="swap-fuell"></span></span><span class="m-w" id="swap"></span></div>
          <div class="netz" role="group" aria-label="Netzwerk" data-t-aria title="Summe aller echten Netzwerkschnittstellen, ohne Docker und VPN" data-t-title>
            <div class="netz-kopf"><span class="mess-label" data-t>Netzwerk</span><span class="nw" title="empfangen" data-t-title><span class="pf-rx" aria-label="empfangen" data-t-aria>↓</span><span id="netz-rx">–</span><i id="netz-rx-e"></i></span><span class="nw" title="gesendet" data-t-title><span class="pf-tx" aria-label="gesendet" data-t-aria>↑</span><span id="netz-tx">–</span><i id="netz-tx-e"></i></span></div>
            <div class="netz-verlauf"><svg id="netz-svg" viewBox="0 0 300 46" preserveAspectRatio="none" role="img" aria-label="Netzwerk-Verlauf der letzten 10 Minuten, empfangen und gesendet" data-t-aria><line class="spark-raster" x1="0" y1="2" x2="300" y2="2"/><path class="spark-flaeche" id="netz-rx-flaeche"/><path class="spark-linie" id="netz-rx-linie"/><path class="spark-tx" id="netz-tx-linie"/></svg></div>
            <div class="spark-achse"><span class="achse-von">vor 10 Min.</span><span id="netz-spitze">Spitze –</span><span data-t>jetzt</span></div>
          </div>
          <div class="last"><span class="m-l" data-t>Last</span><span class="last-werte"><span><b id="l1">–</b><i data-t>1 Min.</i></span><span><b id="l5">–</b><i data-t>5 Min.</i></span><span><b id="l15">–</b><i data-t>15 Min.</i></span><span><b class="mut" id="kerne-n">–</b><i data-t>Kerne</i></span></span></div>
        </div>
      </div>
    </section>

    <section class="karte log" aria-label="Live-Log" data-t-aria>
      <div class="karte-kopf">
        <span class="karte-titel" data-t>Live-Log</span>
        <span class="schritt-chip" id="schritt-chip" hidden></span>
        <span class="luecke"></span>
        <div class="segment" role="group" aria-label="Lange Zeilen" data-t-aria>
          <button type="button" class="seg-knopf" id="k-umbrechen" aria-pressed="true" data-t>Umbrechen</button>
          <button type="button" class="seg-knopf" id="k-abschneiden" aria-pressed="false" data-t>Abschneiden</button>
        </div>
        <button type="button" class="knopf" id="k-pause"></button>
      </div>
      <div class="ereignisse" id="ereignisse" aria-label="Ereignisse" data-t-aria></div>
      <div class="term-rahmen">
        <div class="term" id="term" role="log" aria-label="Ausgabe des laufenden Schritts" data-t-aria tabindex="0">
          <div id="term-innen"></div>
        </div>
        <div class="term-leer" id="term-leer"></div>
        <div class="pause-hinweis" id="pause-hinweis" role="status" hidden><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><rect x="4" y="3" width="2.6" height="10" rx=".6" fill="currentColor"/><rect x="9.4" y="3" width="2.6" height="10" rx=".6" fill="currentColor"/></svg><span id="pause-text"></span><button type="button" class="knopf" id="k-weiter"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4.5 3v10l8-5z" fill="currentColor"/></svg><span data-t>Weiter</span></button></div>
        <div class="pause-hinweis scroll-hinweis" id="scroll-hinweis" role="status" hidden><span id="scroll-text"></span><button type="button" class="knopf zum-ende" id="k-zum-ende" data-t>Zum Ende ↓</button></div>
      </div>
    </section>

    <div class="spalte c">
      <section class="karte proz" aria-label="Prozesse und Platten" data-t-aria>
        <div class="karte-kopf"><span class="karte-titel" data-t>Prozesse</span><span class="karte-meta" data-t>Top 6 nach CPU</span></div>
        <div class="pz pz-kopf"><span>PID</span><span data-t>Benutzer</span><span class="r">CPU %</span><span class="r">RAM %</span><span data-t>Befehl</span></div>
        <div id="prozesse"></div>
        <div class="platten" aria-label="Platten" data-t-aria>
          <div class="karte-kopf"><span class="karte-titel" data-t>Platten</span><span class="karte-meta" id="pl-anzahl"></span></div>
          <div id="platten"></div>
        </div>
      </section>
    </div>
  </main>
</div>

<div id="info-ebene" hidden></div>

<div class="demo" id="demo" hidden>
  <span class="demo-titel">Demo</span>
  <div class="segment" id="demo-zustand" role="group" aria-label="Zustand"></div>
  <div class="segment" id="demo-github" role="group" aria-label="GitHub-Abfrage"></div>
  <div class="segment" id="demo-update" role="group" aria-label="Update"></div>
  <div class="segment" id="demo-kerne" role="group" aria-label="Kerne"></div>
</div>
</body>
</html>
