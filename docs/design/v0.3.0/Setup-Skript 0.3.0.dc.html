<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Ersteinrichtung – Skript auf der VM</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.sk{--surface:#ffffff;--surface-alt:#f6f6f6;--ink:#13212b;--ink-muted:#4f5d67;--border:#d9dee2;--brand:#0e628f;--on-brand:#ffffff;--success:#1f7a4d;--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;background:var(--surface-alt);color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.sk[data-thema="dunkel"]{--surface:#0c1a24;--surface-alt:#13283a;--ink:#eef2f5;--ink-muted:#a9b6c0;--border:#2a3f50;--brand:#5aa9d6;--on-brand:#0c1a24;--success:#5cc08a}
@media (prefers-color-scheme: dark){.sk[data-thema="system"]{--surface:#0c1a24;--surface-alt:#13283a;--ink:#eef2f5;--ink-muted:#a9b6c0;--border:#2a3f50;--brand:#5aa9d6;--on-brand:#0c1a24;--success:#5cc08a}
}
.sk *{box-sizing:border-box}
.sk .weg{display:flex;align-items:center;gap:14px;margin:36px 0 22px}
.sk .weg-schritt{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-muted)}
.sk .weg-schritt.an{color:var(--ink);font-weight:600}
.sk .weg-nr{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:650;border:1.5px solid currentColor}
.sk .weg-schritt.an .weg-nr{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.sk .weg-linie{width:56px;height:1px;background:var(--border)}
.sk .fenster{width:1080px;flex:1;margin-bottom:40px;border-radius:6px;overflow:hidden;background:#0f1d27;box-shadow:0 1px 2px rgba(0,0,0,.12),0 18px 48px rgba(12,26,36,.22);display:flex;flex-direction:column}
.sk .fenster-kopf{height:36px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#1a2a36;color:#a9b6c0;font-size:12px}
.sk .punkte{display:flex;gap:7px;margin-right:10px}
.sk .punkte span{width:11px;height:11px;border-radius:50%;background:#3a4b58}
.sk .fenster-titel{flex:1;text-align:center;margin-right:62px;font-family:var(--mono)}
.sk .term{flex:1;padding:18px 24px;font-family:var(--mono);font-size:13px;line-height:19px;color:#dbe3e9;white-space:pre-wrap}
.sk .z{min-height:19px}
.sk .prompt{color:#7fd4a0}
.sk .cmd{color:#ffffff}
.sk .kopf{color:#ffffff;font-weight:700}
.sk .regel{color:#3d5363}
.sk .ab{color:#9cc9e8;font-weight:700;margin-top:6px}
.sk .ok{color:#7fd4a0}
.sk .hin{color:#8796a2}
.sk .warn{color:#e8c477}
.sk .frage{color:#ffffff}
.sk .eingabe{color:#79b8e6}
.sk .gross{color:#ffffff;font-weight:700}
.sk .url{color:#79b8e6;font-weight:700;text-decoration:underline}
.sk .code{color:#0f1d27;background:#e8c477;font-weight:700;padding:0 6px;border-radius:2px}
.sk .cursor{display:inline-block;width:8px;height:16px;background:#dbe3e9;vertical-align:-3px;opacity:.8}

</style>
</helmet>
<div class="sk" data-thema="{{thema}}" style="width: 1440px; height: 900px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; color: var(--ink)">
  <div class="weg" aria-label="Ablauf der Ersteinrichtung">
    <div class="weg-schritt an"><span class="weg-nr">1</span>Skript auf der VM ausführen</div>
    <div class="weg-linie"></div>
    <div class="weg-schritt"><span class="weg-nr">2</span>Im Browser abschließen</div>
    <div class="weg-linie"></div>
    <div class="weg-schritt"><span class="weg-nr">3</span>Monitor nutzen</div>
  </div>
  <div class="fenster" role="img" aria-label="Terminal mit der Ausgabe des Einrichtungsskripts">
    <div class="fenster-kopf"><div class="punkte"><span></span><span></span><span></span></div><div class="fenster-titel">admin@runner-vm: ~/runner-monitor</div></div>
    <div class="term"><sc-for list="{{zeilen}}" as="z" hint-placeholder-count="30"><div class="z"><sc-for list="{{z.teile}}" as="t" hint-placeholder-count="1"><span class="{{t.c}}">{{t.t}}</span></sc-for></div></sc-for><div class="z"><span class="prompt">admin@runner-vm:~/runner-monitor$ </span><span class="cursor"></span></div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"runner":{"editor":"enum","options":["vorhanden","fehlt"],"default":"vorhanden","section":"Zustand"},"thema":{"editor":"enum","options":["system","hell","dunkel"],"default":"system","section":"Darstellung"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const fehlt = this.props.runner === 'fehlt';
    const t = (c, s) => ({ c: c, t: s });
    const Z = (...teile) => ({ teile: teile });
    const P = t('prompt', 'admin@runner-vm:~$ ');
    const zeilen = [
      Z(P, t('cmd', 'tar xzf runner-monitor-0.3.0.tar.gz && cd runner-monitor')),
      Z(t('prompt', 'admin@runner-vm:~/runner-monitor$ '), t('cmd', 'sudo ./einrichten.sh')),
      Z(t('', '')),
      Z(t('kopf', 'Runner-Monitor 0.3.0 – Einrichtung')),
      Z(t('regel', '──────────────────────────────────────────────────────────')),
      Z(t('ab', 'System prüfen')),
      Z(t('ok', '  ✓ '), t('', 'Ubuntu 24.04 LTS, Python 3.12, Docker 27.3')),
      Z(t('ok', '  ✓ '), t('', 'Netz: 192.0.2.25 (ens18), lokales Netz 192.0.2.0/24'))
    ];
    if (!fehlt) {
      zeilen.push(Z(t('ok', '  ✓ '), t('', 'GitHub-Runner gefunden: runner-vm-01 in /opt/actions-runner, Dienst aktiv')));
      zeilen.push(Z(t('hin', '    → Der Runner bleibt unverändert, es wird nur der Monitor eingerichtet.')));
    } else {
      zeilen.push(Z(t('warn', '  ! '), t('', 'Kein GitHub-Runner gefunden.')));
      zeilen.push(Z(t('frage', '    Runner jetzt mit einrichten? Dafür brauchen Sie ein Registrierungs-Token:')));
      zeilen.push(Z(t('hin', '    GitHub › Organisation › Settings › Actions › Runners › „New runner“')));
      zeilen.push(Z(t('frage', '    Runner einrichten? [j/N] '), t('eingabe', 'j')));
      zeilen.push(Z(t('frage', '    Registrierungs-Token: '), t('eingabe', '••••••••••••••••••••')));
      zeilen.push(Z(t('ok', '  ✓ '), t('', 'Runner runner-vm-01 registriert (Labels: self-hosted, linux, x64, docker)')));
      zeilen.push(Z(t('ok', '  ✓ '), t('', 'Dienst actions.runner.…runner-vm-01 gestartet, Aufräumen vor jedem Job aktiv')));
    }
    zeilen.push(
      Z(t('ab', 'Monitor einrichten')),
      Z(t('ok', '  ✓ '), t('', 'Benutzer runner-monitor angelegt (kein root, keine Anmeldung)')),
      Z(t('ok', '  ✓ '), t('', 'Leserechte: Systemprotokoll, Docker-Status, Runner-Logs')),
      Z(t('ok', '  ✓ '), t('', 'Dienst runner-monitor gestartet, Port 8090')),
      Z(t('ab', 'Firewall (ufw)')),
      Z(t('ok', '  ✓ '), t('', 'SSH (22) bleibt erlaubt')),
      Z(t('ok', '  ✓ '), t('', 'Port 8090 nur aus dem lokalen Netz 192.0.2.0/24')),
      Z(t('ok', '  ✓ '), t('', 'ufw aktiviert')),
      Z(t('regel', '──────────────────────────────────────────────────────────')),
      Z(t('gross', 'Fast geschafft. Schließen Sie die Einrichtung im Browser ab:')),
      Z(t('', '')),
      Z(t('', '    '), t('url', 'http://192.0.2.25:8090')),
      Z(t('', '')),
      Z(t('', '    Einrichtungscode: '), t('code', 'K7QF-2M9D'), t('hin', '   (gilt 60 Minuten, danach: sudo /opt/runner-monitor/aktuell/einrichten.sh code)')),
      Z(t('', ''))
    );
    const P2 = (this.props.thema === 'hell' || this.props.thema === 'dunkel') ? this.props.thema : 'system';
    return { zeilen: zeilen, thema: P2 };
  }
}
</script>
</body>
</html>
