# Prüfungen (Anweisung 01, Takt nach E-30): „geheimnisse“ (gitleaks) bei jedem PR und Push; die volle
# Prüfung „pruefen“ nur vor dem Release – bei PRs nach main, bei Push auf main und von Hand. PRs nach
# develop prüft Claude vor dem Merge lokal (Tests, Node-Tests), damit der einzige Forgejo-Runner nicht
# je Issue 10–15 Minuten belegt ist. Forgejo liest .forgejo/workflows,
# sonst .github/workflows (dieser Ordner); dafür braucht Forgejo einen Actions-Runner (Issue #108).
# Öffentliches Repository: läuft immer auf GitHubs Rechnern (ubuntu-latest), nie auf dem eigenen
# Runner – sonst könnte Code aus fremden Pull Requests auf der Runner-VM laufen.
# Auf Forgejo ist „ubuntu-latest“ ein Container-Image des Forgejo-Runners (act): Schritte laufen dort
# als root, bash mit pipefail, ohne shellcheck. Die Schritte müssen in beiden Umgebungen gehen (#133).
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    # Nur vor dem Release (E-30): PR nach main, Push auf main, von Hand. PRs nach develop und Push auf
    # develop bekommen nur „geheimnisse“ (gitleaks läuft so auch bei direkten Pushes auf develop).
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]   # Ubuntu 22.04 und 24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Versionen stimmen überein
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          grep -q "^VERSION = \"$v\"" runner_monitor/__init__.py || { echo "VERSION ($v) und runner_monitor/__init__.py weichen ab"; exit 1; }
      - name: Python kompiliert
        run: python -m compileall -q runner_monitor tests
      - name: Tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v
      - name: Shell-Skripte (Syntax, shellcheck)
        env:
          LC_ALL: C.UTF-8   # ohne UTF-8-Locale bricht shellcheck an „…“ in einrichten.sh ab (commitBuffer)
        run: |
          for f in einrichten.sh deploy/runner-einrichten.sh deploy/aufraeumen-einrichten.sh werkzeuge/paket.sh werkzeuge/zap-baseline.sh; do bash -n "$f"; done
          sh -n deploy/runner-aufraeumen
          # GitHub-Rechner haben shellcheck; das Image des Forgejo-Runners nicht, dort laufen die Schritte als root (#133).
          # Quelle ist in beiden Fällen das signierte Ubuntu-Paketarchiv.
          if ! command -v shellcheck >/dev/null; then
            als_root=sudo; [ "$(id -u)" = 0 ] && als_root=
            $als_root apt-get update -qq
            $als_root apt-get install -y -qq --no-install-recommends shellcheck
          fi
          shellcheck --version
          shellcheck einrichten.sh deploy/runner-einrichten.sh deploy/aufraeumen-einrichten.sh deploy/runner-aufraeumen werkzeuge/paket.sh werkzeuge/zap-baseline.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: JavaScript-Syntax
        run: for f in web/*.js; do node --check "$f"; done
      - name: JavaScript-Tests (Verlauf)
        run: node --test tests/js/*.test.mjs
      - name: Keine Inline-Skripte oder style-Attribute (CSP)
        run: |
          ! grep -nE '<script>|<script [^>]*>[^<]|style="' web/*.html
      - name: Paket baut
        # Kein „| head“: der Forgejo-Runner (act) startet bash mit pipefail, tar bricht dann mit SIGPIPE (141) ab (#133).
        run: |
          werkzeuge/paket.sh
          (cd dist && sha256sum -c runner-monitor-*.tar.gz.sha256)
          tar -tzf dist/runner-monitor-*.tar.gz > dist/inhalt.txt
          sed -n '1,10p' dist/inhalt.txt

  geheimnisse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          BASIS: ${{ github.event.pull_request.base.sha }}
        run: |
          bereich="${BASIS:+--log-opts=$BASIS..HEAD}"
          # shellcheck disable=SC2086
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.28.0 git $bereich --redact --no-banner
